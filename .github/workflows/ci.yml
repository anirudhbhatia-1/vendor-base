name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - start
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Mandatory quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      COMPOSE_RUNTIME: docker
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned pnpm, Node.js and dependencies
        uses: pnpm/setup@bf5bfae7d43e2b2b1191383f5005cd3fb69b848d # v2.0.2
        with:
          version: 11.19.0
          runtime: node@24.19.0
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          install: false

      - name: Install from lockfile
        run: pnpm install --frozen-lockfile

      - id: format
        name: Check formatting
        continue-on-error: true
        run: pnpm format:check

      - id: lint
        name: Lint and repository policies
        continue-on-error: true
        run: pnpm lint

      - id: typecheck
        name: Type-check workspaces
        continue-on-error: true
        run: pnpm typecheck

      - id: control_tests
        name: Test repository controls
        continue-on-error: true
        run: pnpm test:controls

      - id: unit_tests
        name: Run unit tests
        continue-on-error: true
        run: pnpm test:unit

      # The API and worker integration smokes talk to a real PostgreSQL and a real
      # Valkey: readiness now reports broker state from an actual connection and
      # consumer liveness from the durable heartbeat, neither of which can be
      # answered without the stack. Starting it here rather than letting the smoke
      # skip its own assertions -- a test that quietly skips the thing it is named
      # after is how queue health came to be reported from table presence.
      - id: integration_stack_up
        name: Start the test stack for integration tests
        continue-on-error: true
        run: pnpm db:test:up

      - id: integration_tests
        name: Run integration tests
        continue-on-error: true
        run: pnpm test:integration

      - id: integration_stack_down
        name: Stop the test stack
        if: always()
        continue-on-error: true
        run: pnpm db:test:down

      - id: e2e_tests
        name: Run browser end-to-end tests
        continue-on-error: true
        run: pnpm test:e2e:install && pnpm test:e2e

      - id: build
        name: Build and verify entry points
        continue-on-error: true
        run: pnpm build:verify

      - id: online_test_build
        name: Build the online-test PWA exports
        if: always()
        # Without continue-on-error a failure here skipped the database,
        # dependency-audit and secret-scan steps, and the evidence gate saw
        # them as skipped rather than run; the gate is what fails the job.
        continue-on-error: true
        run: pnpm build:online-test:pwas

      - id: database
        name: Verify PostgreSQL and PostGIS migration lifecycle
        continue-on-error: true
        run: pnpm db:verify

      - id: dependency_audit
        name: Audit production dependencies
        continue-on-error: true
        run: pnpm security:dependencies

      - id: secret_scan
        name: Scan repository for committed secrets
        continue-on-error: true
        run: pnpm security:secrets

      - id: database_cleanup
        name: Remove disposable database
        if: always()
        continue-on-error: true
        run: node database/scripts/compose.mjs test-down

      - name: Write safe CI evidence
        if: always()
        env:
          CI_FORMAT_OUTCOME: ${{ steps.format.outcome }}
          CI_LINT_OUTCOME: ${{ steps.lint.outcome }}
          CI_TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          CI_CONTROL_TESTS_OUTCOME: ${{ steps.control_tests.outcome }}
          CI_UNIT_TESTS_OUTCOME: ${{ steps.unit_tests.outcome }}
          CI_INTEGRATION_TESTS_OUTCOME: ${{ steps.integration_tests.outcome }}
          CI_E2E_TESTS_OUTCOME: ${{ steps.e2e_tests.outcome }}
          CI_BUILD_OUTCOME: ${{ steps.build.outcome }}
          CI_ONLINE_TEST_BUILD_OUTCOME: ${{ steps.online_test_build.outcome }}
          CI_DATABASE_OUTCOME: ${{ steps.database.outcome }}
          CI_DEPENDENCY_AUDIT_OUTCOME: ${{ steps.dependency_audit.outcome }}
          CI_SECRET_SCAN_OUTCOME: ${{ steps.secret_scan.outcome }}
          CI_DATABASE_CLEANUP_OUTCOME: ${{ steps.database_cleanup.outcome }}
        run: node tooling/scripts/ci-evidence.mjs write

      - name: Publish safe CI evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .ci-artifacts/summary.json
            .ci-artifacts/summary.md
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Enforce mandatory results
        if: always()
        env:
          CI_FORMAT_OUTCOME: ${{ steps.format.outcome }}
          CI_LINT_OUTCOME: ${{ steps.lint.outcome }}
          CI_TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          CI_CONTROL_TESTS_OUTCOME: ${{ steps.control_tests.outcome }}
          CI_UNIT_TESTS_OUTCOME: ${{ steps.unit_tests.outcome }}
          CI_INTEGRATION_TESTS_OUTCOME: ${{ steps.integration_tests.outcome }}
          CI_E2E_TESTS_OUTCOME: ${{ steps.e2e_tests.outcome }}
          CI_BUILD_OUTCOME: ${{ steps.build.outcome }}
          CI_ONLINE_TEST_BUILD_OUTCOME: ${{ steps.online_test_build.outcome }}
          CI_DATABASE_OUTCOME: ${{ steps.database.outcome }}
          CI_DEPENDENCY_AUDIT_OUTCOME: ${{ steps.dependency_audit.outcome }}
          CI_SECRET_SCAN_OUTCOME: ${{ steps.secret_scan.outcome }}
          CI_DATABASE_CLEANUP_OUTCOME: ${{ steps.database_cleanup.outcome }}
        run: node tooling/scripts/ci-evidence.mjs gate
