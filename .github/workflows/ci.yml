name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - start
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Mandatory quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      COMPOSE_RUNTIME: docker
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned pnpm, Node.js and dependencies
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: 11.19.0
          runtime: node@24.19.0
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          install: false

      - name: Install from lockfile
        run: pnpm install --frozen-lockfile

      - id: format
        name: Check formatting
        continue-on-error: true
        run: pnpm format:check

      - id: lint
        name: Lint and repository policies
        continue-on-error: true
        run: pnpm lint

      - id: typecheck
        name: Type-check workspaces
        continue-on-error: true
        run: pnpm typecheck

      - id: control_tests
        name: Test repository controls
        continue-on-error: true
        run: pnpm test:controls

      - id: unit_tests
        name: Run unit tests
        continue-on-error: true
        run: pnpm test:unit

      - id: integration_tests
        name: Run integration tests
        continue-on-error: true
        run: pnpm test:integration

      - id: build
        name: Build and verify entry points
        continue-on-error: true
        run: pnpm build:verify

      - id: database
        name: Verify PostgreSQL and PostGIS migration lifecycle
        continue-on-error: true
        run: pnpm db:verify

      - id: dependency_audit
        name: Audit production dependencies
        continue-on-error: true
        run: pnpm security:dependencies

      - id: secret_scan
        name: Scan repository for committed secrets
        continue-on-error: true
        run: pnpm security:secrets

      - id: database_cleanup
        name: Remove disposable database
        if: always()
        continue-on-error: true
        run: node database/scripts/compose.mjs test-down

      - name: Write safe CI evidence
        if: always()
        env:
          CI_FORMAT_OUTCOME: ${{ steps.format.outcome }}
          CI_LINT_OUTCOME: ${{ steps.lint.outcome }}
          CI_TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          CI_CONTROL_TESTS_OUTCOME: ${{ steps.control_tests.outcome }}
          CI_UNIT_TESTS_OUTCOME: ${{ steps.unit_tests.outcome }}
          CI_INTEGRATION_TESTS_OUTCOME: ${{ steps.integration_tests.outcome }}
          CI_BUILD_OUTCOME: ${{ steps.build.outcome }}
          CI_DATABASE_OUTCOME: ${{ steps.database.outcome }}
          CI_DEPENDENCY_AUDIT_OUTCOME: ${{ steps.dependency_audit.outcome }}
          CI_SECRET_SCAN_OUTCOME: ${{ steps.secret_scan.outcome }}
          CI_DATABASE_CLEANUP_OUTCOME: ${{ steps.database_cleanup.outcome }}
        run: node tooling/scripts/ci-evidence.mjs write

      - name: Publish safe CI evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .ci-artifacts/summary.json
            .ci-artifacts/summary.md
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Enforce mandatory results
        if: always()
        env:
          CI_FORMAT_OUTCOME: ${{ steps.format.outcome }}
          CI_LINT_OUTCOME: ${{ steps.lint.outcome }}
          CI_TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          CI_CONTROL_TESTS_OUTCOME: ${{ steps.control_tests.outcome }}
          CI_UNIT_TESTS_OUTCOME: ${{ steps.unit_tests.outcome }}
          CI_INTEGRATION_TESTS_OUTCOME: ${{ steps.integration_tests.outcome }}
          CI_BUILD_OUTCOME: ${{ steps.build.outcome }}
          CI_DATABASE_OUTCOME: ${{ steps.database.outcome }}
          CI_DEPENDENCY_AUDIT_OUTCOME: ${{ steps.dependency_audit.outcome }}
          CI_SECRET_SCAN_OUTCOME: ${{ steps.secret_scan.outcome }}
          CI_DATABASE_CLEANUP_OUTCOME: ${{ steps.database_cleanup.outcome }}
        run: node tooling/scripts/ci-evidence.mjs gate
