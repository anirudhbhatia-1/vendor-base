name: neighbourhood-store-online-test

services:
  api:
    image: ${API_IMAGE:?API_IMAGE must be an immutable digest-pinned image}
    environment:
      APP_ENV: online-test
      DATA_MODE: synthetic
      RELEASE_VERSION: ${RELEASE_VERSION:?RELEASE_VERSION must be the deployed Git SHA}
      API_HOST: 0.0.0.0
      API_PORT: '3001'
    ports:
      - '127.0.0.1:3001:3001'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3001/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    stop_grace_period: 30s
    networks:
      - private

  worker:
    image: ${WORKER_IMAGE:?WORKER_IMAGE must be an immutable digest-pinned image}
    environment:
      APP_ENV: online-test
      DATA_MODE: synthetic
      RELEASE_VERSION: ${RELEASE_VERSION:?RELEASE_VERSION must be the deployed Git SHA}
    healthcheck:
      test: [CMD, node, -e, 'process.kill(1, 0)']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    stop_grace_period: 30s
    networks:
      - private

networks:
  private:
    internal: true
