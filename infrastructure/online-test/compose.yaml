name: neighbourhood-store-online-test

services:
  api:
    image: ${API_IMAGE:?API_IMAGE must be an immutable digest-pinned image}
    environment:
      APP_ENV: online-test
      DATA_MODE: synthetic
      RELEASE_VERSION: ${RELEASE_VERSION:?RELEASE_VERSION must be the deployed Git SHA}
      API_HOST: 0.0.0.0
      API_PORT: '3001'
      # Private material. Supplied by the host secret store through release.env; the
      # runtime refuses the committed synthetic defaults outside local development.
      ALLOW_SYNTHETIC_PROVIDERS: ${ALLOW_SYNTHETIC_PROVIDERS:?online-test runs only local-only fake adapters and must acknowledge them}
      ONLINE_TEST_SUPABASE_PROJECT_REF: ${ONLINE_TEST_SUPABASE_PROJECT_REF:?ONLINE_TEST_SUPABASE_PROJECT_REF is required}
      ONLINE_TEST_DATABASE_URL: ${ONLINE_TEST_DATABASE_URL:?ONLINE_TEST_DATABASE_URL is required}
      VALKEY_URL: ${VALKEY_URL:?VALKEY_URL is required}
      OTP_HASH_KEY: ${OTP_HASH_KEY:?OTP_HASH_KEY is required}
      SESSION_TOKEN_HASH_KEY: ${SESSION_TOKEN_HASH_KEY:?SESSION_TOKEN_HASH_KEY is required}
      OBJECT_STORAGE_GRANT_KEY: ${OBJECT_STORAGE_GRANT_KEY:?OBJECT_STORAGE_GRANT_KEY is required}
      PAYMENT_WEBHOOK_KEY: ${PAYMENT_WEBHOOK_KEY:?PAYMENT_WEBHOOK_KEY is required}
      PROVIDER_CLEARING_ACCOUNT_REFERENCE: ${PROVIDER_CLEARING_ACCOUNT_REFERENCE:?PROVIDER_CLEARING_ACCOUNT_REFERENCE is required}
    ports:
      - '127.0.0.1:3001:3001'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3001/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    stop_grace_period: 30s
    networks:
      - private

  worker:
    image: ${WORKER_IMAGE:?WORKER_IMAGE must be an immutable digest-pinned image}
    environment:
      APP_ENV: online-test
      DATA_MODE: synthetic
      RELEASE_VERSION: ${RELEASE_VERSION:?RELEASE_VERSION must be the deployed Git SHA}
      ALLOW_SYNTHETIC_PROVIDERS: ${ALLOW_SYNTHETIC_PROVIDERS:?online-test runs only local-only fake adapters and must acknowledge them}
      # Under the 30s stop_grace_period below, leaving room for pools to close after
      # the queues drain. The 4s default exists so a watch-mode restart is not held
      # up locally; a deployment that allows 30s should use most of it.
      WORKER_SHUTDOWN_GRACE_MS: '25000'
      ONLINE_TEST_SUPABASE_PROJECT_REF: ${ONLINE_TEST_SUPABASE_PROJECT_REF:?ONLINE_TEST_SUPABASE_PROJECT_REF is required}
      ONLINE_TEST_DATABASE_URL: ${ONLINE_TEST_DATABASE_URL:?ONLINE_TEST_DATABASE_URL is required}
      VALKEY_URL: ${VALKEY_URL:?VALKEY_URL is required}
      OBJECT_STORAGE_GRANT_KEY: ${OBJECT_STORAGE_GRANT_KEY:?OBJECT_STORAGE_GRANT_KEY is required}
      PAYMENT_WEBHOOK_KEY: ${PAYMENT_WEBHOOK_KEY:?PAYMENT_WEBHOOK_KEY is required}
      PROVIDER_CLEARING_ACCOUNT_REFERENCE: ${PROVIDER_CLEARING_ACCOUNT_REFERENCE:?PROVIDER_CLEARING_ACCOUNT_REFERENCE is required}
    healthcheck:
      test: [CMD, node, -e, 'process.kill(1, 0)']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    stop_grace_period: 30s
    networks:
      - private

networks:
  private:
    internal: true
